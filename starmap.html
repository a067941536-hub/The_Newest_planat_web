<script>
(function(){
'use strict';

var TG=[['lines','星座連線'],['names','名稱'],['ecl','黃道'],['mw','銀河'],['grid','高度圈']];
var tgs=document.getElementById('tgs');TG.forEach(function(t){var b=document.createElement('button');b.className='sb on';b.textContent=t[1];b.onclick=function(){S.tg[t[0]]=!S.tg[t[0]];b.classList.toggle('on',S.tg[t[0]]);};tgs.appendChild(b);});

var last=0;

  if(S.tg.ecl){ctx.strokeStyle='rgba(253,231,165,.38)';ctx.setLineDash([5,6]);ctx.lineWidth=1.2;ctx.beginPath();var st=false;for(var l=0;l<=360;l+=3){var e=ASTRO.eclToEq(l*D2R,0,d),h=altaz(e.ra,e.dec,d);if(h.alt<-.02){st=false;continue;}var o=proj(h);if(!st){ctx.moveTo(o.x,o.y);st=true;}else ctx.lineTo(o.x,o.y);}ctx.stroke();ctx.setLineDash([]);}

  ctx.font='500 12px '+FONT;ctx.textAlign='center';
  SM.CON.forEach(function(c){
    var pts=c[2].map(function(s){var h=altaz(s.ra,s.dec,d);return {p:proj(h),alt:h.alt,s:s};}),isZ=ZODIAC.indexOf(c[0])>=0,hi=(c[0]===S.sign),sc=(c[0]===sunCon);
    if(S.tg.lines){ctx.lineWidth=hi?2.2:1.1;ctx.strokeStyle=hi?'rgba(253,231,165,.95)':(isZ?'rgba(140,170,255,'+(.5*Math.max(.3,starA))+')':'rgba(140,170,255,'+(.25*Math.max(.3,starA))+')');
      c[3].forEach(function(e){var A=pts[e[0]],B=pts[e[1]];if(A.alt<-.02||B.alt<-.02)return;ctx.beginPath();ctx.moveTo(A.p.x,A.p.y);ctx.lineTo(B.p.x,B.p.y);ctx.stroke();});}
    pts.forEach(function(o){if(o.alt<0)return;var r=Math.max(.8,3.4-o.s.mag*.55),a=starA*(.55+.45*Math.min(1,(5-o.s.mag)/3));

    var vis=pts.filter(function(o){return o.alt>.05;});
    if(S.tg.names&&vis.length&&starA>.25){var mx=0,my=0;vis.forEach(function(o){mx+=o.p.x;my+=o.p.y;});mx/=vis.length;my/=vis.length;
      ctx.fillStyle=hi?'#ffe08a':(sc?'#ffd98a':(isZ?'rgba(190,205,255,.92)':'rgba(170,185,235,.6)'));ctx.font=(hi||sc?'700 ':'500 ')+'13px '+FONT;ctx.fillText(c[1]+(sc?' ☀':''),mx,my+16);if(isZ)S.hits.push({x:mx,y:my+12,r:30,go:'zodiac/zodiac_'+c[0]+'.html',n:c[1]+'（點擊看運勢）'});}
  });
