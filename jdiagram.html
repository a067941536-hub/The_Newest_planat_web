<style>
html,body{overflow:hidden}
.sound-fab,.anim-fab{display:none!important}
.wrapper{min-height:0!important;height:100vh;height:100svh}
.stage{position:relative;height:calc(100svh - 72px);overflow:hidden}
#sim{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#sim.drag{cursor:grabbing}
.sim-panel{position:absolute!important;overflow:auto!important;border-radius:20px!important;padding:16px 18px;z-index:20}
.sim-panel::-webkit-scrollbar{width:6px}
.p-left{left:16px;top:16px;width:272px;max-height:calc(100% - 100px)}
.p-left h1{font-family:var(--font-display);font-size:1.15rem;margin:0 0 2px;letter-spacing:.06em}
.p-left .sub{color:var(--muted);font-size:.78rem;margin:0 0 12px}
.grp{margin-top:14px}
.grp>label{display:block;color:var(--dim);font-size:.7rem;letter-spacing:.2em;margin-bottom:7px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.tg{font:inherit;font-size:.8rem;color:var(--muted);background:rgba(139,124,246,.08);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.25s var(--ease)}
.seg button:hover,.tg:hover{color:#fff;border-color:var(--line-strong)}
.seg button.on,.tg.on{color:#fff;background:linear-gradient(135deg,rgba(139,124,246,.5),rgba(94,234,212,.28));border-color:var(--line-strong);box-shadow:0 0 16px rgba(139,124,246,.3)}
.simdate{font-family:var(--font-display);font-size:1.25rem;letter-spacing:.06em;color:#fff}
.simdate small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;font-family:var(--font)}
.date-in,.ev-sel{width:100%;margin-bottom:7px;font:inherit;font-size:.82rem;color:#fff;background:rgba(139,124,246,.12);border:1px solid var(--line);border-radius:12px;padding:7px 10px;color-scheme:dark}
.ev-sel option{background:#10143a}
.ev-note{margin-top:4px!important}
.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(94,234,212,.07);border:1px solid rgba(94,234,212,.2);color:#cfe;font-size:.76rem;line-height:1.6}
.p-right{right:16px;top:16px;width:318px;max-height:calc(100% - 100px)}
.p-right h2{margin:0;font-family:var(--font-display);font-size:1.5rem;letter-spacing:.06em;border:0!important;padding:0!important;display:flex;align-items:center;gap:10px}
.tag{font-size:.68rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--teal);letter-spacing:.12em;font-family:var(--font)}
.tagline{color:#d5dcff;font-size:.9rem;margin:8px 0 12px;line-height:1.7}
.stats-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats-g div{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.stats-g small{display:block;color:var(--dim);font-size:.68rem;letter-spacing:.1em}
.stats-g b{font-size:.88rem;font-weight:500;color:#fff}
.cmp{margin-top:12px;font-size:.78rem;color:var(--muted)}
.cmp .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .7s var(--ease)}
.fun{margin-top:12px;font-size:.82rem;color:#e7defa;line-height:1.7}
.fun::before{content:"💡 ";}
.go-detail{display:inline-flex;margin-top:14px;padding:9px 20px;border-radius:999px;text-decoration:none;color:#fff;font-size:.85rem;background:linear-gradient(120deg,#7c6cf0,#3b9eff 60%,#2dd4bf);box-shadow:0 8px 24px rgba(76,110,245,.35);transition:.3s var(--ease)}
.go-detail:hover{transform:translateY(-2px)}
.guide ul{margin:8px 0 0;padding-left:1.2em;color:var(--muted);font-size:.85rem;line-height:1.9}
.guide li b{color:#fff;font-weight:500}
.close{position:absolute;right:12px;top:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-size:.9rem}
.close:hover{color:#fff;border-color:var(--line-strong)}
.bar-bottom{position:absolute;width:max-content;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;display:flex;gap:6px;padding:8px;max-width:calc(100% - 32px);overflow-x:auto;border-radius:999px!important;scrollbar-width:none}
.bar-bottom::-webkit-scrollbar{display:none}
.chip-b{flex:none;display:flex;align-items:center;gap:7px;font:inherit;font-size:.82rem;color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 13px 6px 9px;cursor:pointer;transition:.25s var(--ease)}
.chip-b i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 10px currentColor}
.chip-b:hover{color:#fff;background:rgba(139,124,246,.14)}
.chip-b.on{color:#fff;background:rgba(139,124,246,.28);border-color:var(--line-strong)}
.zoom-btns{position:absolute;right:16px;bottom:76px;z-index:20;display:flex;flex-direction:column;gap:8px}
.scale-tip{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:15;color:var(--dim);font-size:.74rem;letter-spacing:.12em;pointer-events:none;white-space:nowrap}
#tip{position:absolute;z-index:30;pointer-events:none;padding:6px 12px;border-radius:10px;background:rgba(8,12,36,.85);border:1px solid var(--line-strong);font-size:.8rem;opacity:0;transition:opacity .15s;transform:translate(12px,-34px)}
@media(max-width:860px){

  .p-right{top:auto;right:12px;left:12px;width:auto;bottom:70px;max-height:42%}
  .zoom-btns{display:none}
  .scale-tip{display:none}
  .bar-bottom{left:12px;transform:none;max-width:calc(100% - 24px);padding-left:56px}

<script>
(function(){
'use strict';
/* ---------- 資料 ---------- */
// a: 軌道半長軸(AU)  P: 公轉週期(天)  L0: J2000 平黃經(度)  c: 顏色
var BODIES=[
 {id:'sun',n:'太陽',type:'恆星',c:['#fff7d6','#ffd36b','#ff8a2a'],page:'planet/planet_sun.html',
  tag:'整個太陽系的光與熱，都來自它。',stats:[['直徑','1,392,000 km'],['表面溫度','約 5,500 °C'],['占太陽系質量','99.86 %'],['年齡','約 46 億年']],cmp:109,
  fun:'太陽的體積可以塞進約 130 萬個地球。'},
 {id:'mercury',n:'水星',type:'岩石行星',a:.387,P:87.97,L0:252.25,c:['#d9d4cc','#9c958b','#5c564f'],r:4.5,page:'planet/planet_merc.html',
  tag:'最小、離太陽最近，一年只有 88 天。',stats:[['距太陽','0.39 AU'],['公轉一圈','88 天'],['自轉一天','59 個地球日'],['直徑','4,879 km'],['衛星','0 顆'],['平均溫度','約 167 °C'],['陽光抵達','約 3 分鐘']],cmp:.38,
  fun:'沒有大氣保溫，白天可超過 400 °C，夜晚低到 −180 °C。'},
 {id:'venus',n:'金星',type:'岩石行星',a:.723,P:224.7,L0:181.98,c:['#fff0c2','#e8c070','#a77a32'],r:7,page:'planet/planet_venus.html',
  tag:'比水星更熱，濃厚的雲把熱量鎖在地表。',stats:[['距太陽','0.72 AU'],['公轉一圈','225 天'],['自轉一天','243 個地球日'],['直徑','12,104 km'],['衛星','0 顆'],['地表溫度','約 465 °C'],['陽光抵達','約 6 分鐘']],cmp:.95,
  fun:'金星自轉比公轉還慢，而且方向相反，太陽在那裡是西升東落。'},
 {id:'earth',n:'地球',type:'岩石行星',a:1,P:365.25,L0:100.46,c:['#9fd0ff','#3b82d6','#16397a'],r:7.5,page:'planet/planet_earth.html',
  tag:'目前已知唯一有生命的星球。',stats:[['距太陽','1 AU（約 1.5 億 km）'],['公轉一圈','365.25 天'],['自轉一天','24 小時'],['直徑','12,742 km'],['衛星','1 顆（月球）'],['平均溫度','約 15 °C'],['陽光抵達','約 8.3 分鐘']],cmp:1,
  fun:'1 AU 就是地球到太陽的距離，是天文學最常用的「尺」。'},
 {id:'mars',n:'火星',type:'岩石行星',a:1.524,P:686.98,L0:355.45,c:['#ffb08a','#d9623b','#7c2d16'],r:5.5,page:'planet/planet_mars.html',
  tag:'表面的鐵鏽讓它呈現紅色，是探測器最常拜訪的鄰居。',stats:[['距太陽','1.52 AU'],['公轉一圈','687 天'],['自轉一天','24 時 37 分'],['直徑','6,779 km'],['衛星','2 顆'],['平均溫度','約 −65 °C'],['陽光抵達','約 12.7 分鐘']],cmp:.53,
  fun:'火星上有太陽系最高的火山：奧林帕斯山，約 22 公里高。'},
 {id:'jupiter',n:'木星',type:'氣態巨行星',a:5.203,P:4332.6,L0:34.4,c:['#f3dcb8','#c99a62','#7a5430'],r:16,page:'planet/planet_jupiter.html',
  tag:'最大的行星，質量是其他行星總和的 2.5 倍。',stats:[['距太陽','5.2 AU'],['公轉一圈','11.9 年'],['自轉一天','約 10 小時'],['直徑','139,820 km'],['已知衛星','95 顆（持續增加）'],['雲頂溫度','約 −110 °C'],['陽光抵達','約 43 分鐘']],cmp:10.97,
  fun:'大紅斑是一場已持續數百年的巨大風暴，比地球還大。'},
 {id:'saturn',n:'土星',type:'氣態巨行星',a:9.537,P:10759,L0:49.94,c:['#fbeccb','#d9b878','#8a6a33'],r:13,ring:true,page:'planet/planet_saturn.html',
  tag:'擁有最壯觀的行星環，密度比水還小。',stats:[['距太陽','9.5 AU'],['公轉一圈','29.5 年'],['自轉一天','約 10.7 小時'],['直徑','116,460 km'],['已知衛星','274 顆（持續增加）'],['雲頂溫度','約 −140 °C'],['陽光抵達','約 1.3 小時']],cmp:9.14,
  fun:'土星環主要由冰塊組成，寬達數十萬公里，卻薄到只有約十公尺到數百公尺。'},
 {id:'uranus',n:'天王星',type:'冰巨星',a:19.19,P:30688,L0:313.23,c:['#e0fbff','#8fd8e6','#3f8fa3'],r:10,ring:'thin',page:'planet/planet_uranus.html',
  tag:'躺著公轉的冰巨星，自轉軸傾斜約 98 度。',stats:[['距太陽','19.2 AU'],['公轉一圈','84 年'],['自轉一天','約 17 小時'],['直徑','50,724 km'],['已知衛星','29 顆（持續增加）'],['雲頂溫度','約 −195 °C'],['陽光抵達','約 2.7 小時']],cmp:3.98,
  fun:'因為「躺著轉」，天王星的極地會連續約 42 年白天、42 年黑夜。'},
 {id:'neptune',n:'海王星',type:'冰巨星',a:30.07,P:60190,L0:304.88,c:['#b8c8ff','#4a6ee0','#1a2d8f'],r:10,page:'planet/planet_neptune.html',
  tag:'最遠的行星，風速是太陽系之冠。',stats:[['距太陽','30.1 AU'],['公轉一圈','165 年'],['自轉一天','約 16 小時'],['直徑','49,244 km'],['已知衛星','16 顆'],['雲頂溫度','約 −200 °C'],['陽光抵達','約 4.2 小時']],cmp:3.86,
  fun:'海王星 2011 年才剛完整繞太陽一圈（自 1846 年被發現起算）。'}
];
var BY={}; BODIES.forEach(function(b){BY[b.id]=b;});
var PL=BODIES.filter(function(b){return b.a;});
var CO=[
 {id:'halley',comet:1,n:'哈雷彗星',type:'週期彗星',c:['#eaf4ff','#9fd0ff','#5a8fd0'],tag:'約每 76 年回來一次，是最有名的彗星。',stats:[['軌道週期','約 76 年'],['近日點','0.59 AU'],['遠日點','約 35 AU'],['上次近日點','1986-02-09'],['下次近日點','2061-07-28']],fun:'目前它位在海王星軌道外側，接近最遠點；回到太陽附近時會長出明顯的彗尾。'},
 {id:'encke',comet:1,n:'恩克彗星',type:'短週期彗星',c:['#eaf4ff','#9fd0ff','#5a8fd0'],tag:'週期最短的彗星之一，只要約 3.3 年。',stats:[['軌道週期','約 3.3 年'],['近日點','0.34 AU'],['遠日點','約 4.1 AU'],['上次近日點','2023-10-22']],fun:'它的軌道在水星與木星之間，每隔幾年就回到太陽附近一次。'},
 {id:'c67p',comet:1,n:'67P 彗星',type:'木星族彗星',c:['#eaf4ff','#9fd0ff','#5a8fd0'],tag:'羅賽塔號探測的彗星。',stats:[['軌道週期','約 6.4 年'],['近日點','1.24 AU'],['遠日點','約 5.7 AU'],['上次近日點','2021-11-02']],fun:'2014 年歐洲的羅賽塔號環繞它，菲萊登陸器還登上了彗核，是人類第一次在彗星表面著陸。'}
];
CO.forEach(function(c){BY[c.id]=c;c.orb=ASTRO.cometOrbit(c.id,160);});
var BELT={id:'belt',n:'小行星帶',type:'小行星區',page:'planet/planet_asteroid.html',
  tag:'火星與木星之間，數百萬顆岩石天體環繞太陽。',stats:[['位置','約 2.2 – 3.2 AU'],['最大天體','穀神星（矮行星）'],['總質量','不到月球的 5 %'],['天體密度','其實很稀疏']],
  fun:'電影裡擠滿隕石的畫面是誇張的，真實的小行星帶彼此相距非常遠。'};

/* ---------- 狀態 ---------- */
var cv=document.getElementById('sim'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
var W=0,H=0,dpr=1,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={comet:true,mode:'learn',speed:30,sim:0,zoom:1,tz:1,px:0,py:0,tpx:0,tpy:0,sel:null,follow:null,orbit:true,label:true,hover:null,guide:true};
var J2000=Date.UTC(2000,0,1,12),today0=Date.now();
var hits=[],ptr={},drag=null,lastT=0;
// 小行星帶粒子
var rocks=[];for(var i=0;i<700;i++)rocks.push({t:Math.random()*6.283,f:Math.random(),s:Math.random()*1.1+.35,a:.3+Math.random()*.5});
var stars=[];

/* ---------- 比例轉換 ---------- */
var LN=Math.log(30.07/.387),ROUT=370;
function radiusAU(a){ // 回傳 "基準半徑"（以 ROUT 為遠端）
  if(S.mode==='real')return a/42*ROUT;           // 古柏帶約到 ~42 AU
  return 52+290*Math.log(a/.387)/LN;               // 對數壓縮
}
function fit(){return Math.min(W,H)*.46/ROUT;}
function sc(){return fit()*S.zoom;}
function sizeF(){return Math.max(.75,Math.min(1.9,Math.sqrt(sc())));}

/* ---------- 位置 ---------- */
function daysNow(){return (today0-J2000)/864e5+S.sim;}
function pos(b){
  if(b.comet){var q=ASTRO.comet(b.id,daysNow()),rr=radiusAU(q.r)*sc();return {x:W/2+S.px+rr*Math.cos(q.lon),y:H/2+S.py-rr*Math.sin(q.lon),r:rr,th:q.lon};}
  var th=ASTRO.helio(b.id,daysNow()).lon,r=radiusAU(b.a)*sc();
  return {x:W/2+S.px+r*Math.cos(th),y:H/2+S.py-r*Math.sin(th),r:r,th:th};
}

/* ---------- 繪圖 ---------- */
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawSun(t){
  var cx=W/2+S.px,cy=H/2+S.py,k=sizeF(),R=20*k*(S.mode==='real'?Math.max(.7,Math.min(1.4,S.zoom/3+.55)):1);
  var pulse=1+.03*Math.sin(t/900);
  ctx.save();ctx.globalCompositeOperation='lighter';
  var g=ctx.createRadialGradient(cx,cy,R*.6,cx,cy,R*6.5*pulse);
  g.addColorStop(0,'rgba(255,190,90,.55)');g.addColorStop(.3,'rgba(255,130,50,.16)');g.addColorStop(1,'rgba(255,100,40,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*6.5*pulse,0,6.283);ctx.fill();ctx.restore();

function pinch(){var k=Object.keys(ptr);if(k.length<2)return 0;var a=ptr[k[0]],b=ptr[k[1]];return Math.hypot(a.x-b.x,a.y-b.y);}
cv.addEventListener('pointermove',function(e){
  var tip=document.getElementById('tip');
  if(!ptr[e.pointerId]){var h=hitAt(e.offsetX,e.offsetY);S.hover=h?h.b.id:null;cv.style.cursor=h?'pointer':'grab';
    if(h){tip.textContent=h.b.n;tip.style.left=e.offsetX+'px';tip.style.top=e.offsetY+'px';tip.style.opacity=1;}else tip.style.opacity=0;return;}
  var p=ptr[e.pointerId],dx=e.offsetX-p.x,dy=e.offsetY-p.y;p.x=e.offsetX;p.y=e.offsetY;
  if(Object.keys(ptr).length>=2){var d=pinch();if(drag.d0){S.tz=Math.max(.45,Math.min(60,S.tz*d/drag.d0));S.zoom=S.tz;}drag.d0=d;drag.moved=9;return;}
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.moved>4){S.px+=dx;S.py+=dy;S.follow=null;cv.classList.add('drag');document.getElementById('tip').style.opacity=0;}
});
function up(e){var wasTap=drag&&drag.moved<=4&&Object.keys(ptr).length===1;delete ptr[e.pointerId];cv.classList.remove('drag');
  if(wasTap){var h=hitAt(e.offsetX,e.offsetY);if(h)select(h.b.id);else if(S.sel)resetView();}
  if(!Object.keys(ptr).length)drag=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',function(){document.getElementById('tip').style.opacity=0;S.hover=null;});
cv.addEventListener('wheel',function(e){e.preventDefault();
  var f=e.deltaY<0?1.15:1/1.15,nz=Math.max(.45,Math.min(60,S.tz*f)),r=nz/S.tz,cx=e.offsetX-W/2,cy=e.offsetY-H/2;
  if(!S.follow){S.px=cx-(cx-S.px)*r;S.py=cy-(cy-S.py)*r;}S.tz=nz;S.zoom=nz;},{passive:false});
cv.addEventListener('dblclick',resetView);

addEventListener('resize',resize);resize();renderInfo();requestAnimationFrame(frame);
})();
</script>
