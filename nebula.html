<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uPan; uniform float uZoom; uniform float uType;
uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3; uniform vec3 uC4; uniform float uSeed;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.)); return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=.5; } return v; }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
vec3 stars(vec2 uv){
  vec3 col=vec3(0.);
  for(int l=0;l<3;l++){
    float fl=float(l), sc=16.+fl*20.;
    vec2 p=uv*sc+vec2(fl*17.3,fl*9.1)+uSeed, id=floor(p), f=fract(p)-.5;
    float h=hash(id);
    if(h>.84-fl*.05){
      vec2 off=(vec2(hash(id+3.1),hash(id+7.7))-.5)*.6, q=f-off; float d=length(q), mag=hash(id+11.)*hash(id+5.);
      float b=exp(-d*d*(300.-fl*70.))*(.35+1.8*mag), tw=.85+.15*sin(uTime*(1.+h*4.)+h*40.);
      float sp=0.; if(mag>.5) sp=(exp(-abs(q.x)*70.)*exp(-abs(q.y)*6.)+exp(-abs(q.y)*70.)*exp(-abs(q.x)*6.))*.55*mag;
      col+=mix(vec3(.7,.82,1.),vec3(1.,.82,.65),hash(id+2.2))*(b+sp)*tw;
    }
  }
  return col;
}
float pillar(vec2 p){
  float m=0.;
  for(int i=0;i<3;i++){
    float fi=float(i), x0=-.3+fi*.31, top=.18+fi*.05-fi*fi*.07, w=.11-fi*.018;
    float e=(fbm(vec2(p.y*3.+fi*3.,p.x*2.))-.5)*.16;
    float wx=w*1.25*(1.+max(0.,top-p.y)*.8);
    float inside=smoothstep(wx,wx*.55,abs(p.x-x0+(p.y-top)*.08+e))*smoothstep(top+.03+e*.5,top-.12,p.y);
    m=max(m,inside);
  }
  return m;
}
float sdCap(vec2 p,vec2 a,vec2 b,float r){ vec2 pa=p-a,ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; uv=uv/uZoom+uPan;
  float t=uTime*.02; vec3 col=vec3(0.); float shade=1.;
  if(uType<.5){ // 獵戶座大星雲
    vec2 p=uv*1.7; vec2 q=vec2(fbm(p+vec2(0.,t)),fbm(p+vec2(5.2,1.3)-t)); vec2 r=vec2(fbm(p+3.*q+vec2(1.7,9.2)+t),fbm(p+3.*q+vec2(8.3,2.8)-t)); float f=fbm(p+3.*r);
    float rad=length((uv-vec2(.06,.02))*vec2(1.,1.15)), core=exp(-rad*3.4);
    float dens=smoothstep(.12,.95,f)*(.3+1.1*core)+core*.95;
    vec3 c=mix(uC1,uC2,clamp(f*1.7,0.,1.)); c=mix(c,uC3,clamp(r.x*r.y*2.6,0.,1.)*.75); c+=uC4*core*core*.9;
    float lane=smoothstep(.5,.78,fbm(p*2.1+q*2.)); c*=(1.-.7*lane*(1.-core));
    col=c*dens*1.25; col+=uC3*.18*smoothstep(.4,.0,length(uv+vec2(.5,-.28)))*fbm(p*3.);
  } else if(uType<1.5){ // 創生之柱
    vec2 p=uv+vec2(0.,.05); float gas=fbm(p*2.3+vec2(0.,t*3.)+fbm(p*3.)*1.3);
    vec3 bg=mix(uC1,uC2,gas)*(.3+1.0*gas)*(.55+.7*smoothstep(-.5,.5,p.y)); bg+=uC3*.25*smoothstep(.55,.9,gas);
    float m=pillar(p); float lit=clamp((fbm(p*8.+1.)-.35)*2.,0.,1.);
    vec3 body=mix(vec3(.12,.065,.05),vec3(.62,.34,.17),lit*.8);
    float rim=clamp(m-pillar(p+vec2(.014,-.016)),0.,1.)*4.; float rim2=clamp(m-pillar(p+vec2(-.01,-.02)),0.,1.)*3.;
    col=mix(bg,body,m*.93)+uC4*(rim+rim2*.5)*(.5+.8*fbm(p*20.)); shade=1.-m*.8;
  } else if(uType<2.5){ // 環狀星雲
    vec2 p=rot(-.45)*uv*vec2(1.,1.18); float r=length(p), n=fbm(p*5.+t*2.), ringR=.2+.035*(n-.5)*2.;
    float ring=exp(-pow((r-ringR)/.042,2.)), inner=smoothstep(ringR,0.,r)*.55, outer=exp(-pow((r-ringR-.075)/.1,2.))*.5;
    col=uC1*inner*(.7+.6*fbm(p*8.))+mix(uC2,uC3,smoothstep(.17,.3,r))*ring*(.6+1.2*n)*(.75+.5*fbm(p*16.))+uC3*outer*fbm(p*3.5)*1.3;
    col+=vec3(.85,.92,1.)*exp(-r*r*1400.)*3.2; shade=1.;
  } else if(uType<3.5){ // 蟹狀星雲
    vec2 p=uv*1.5; float rad=length(p*vec2(1.,1.18)), shape=smoothstep(.55,.18,rad);
    float fil=abs(fbm(p*5.+fbm(p*3.)*2.2)-.5), fil2=1.-smoothstep(0.,.055,fil), fil3=1.-smoothstep(0.,.04,abs(fbm(p*9.+4.+t)-.5));
    col=uC1*fil2*shape*1.7+uC2*fil3*shape*1.1+uC3*exp(-rad*3.6)*.95*(.6+.7*fbm(p*4.))+uC4*fil2*fil3*shape*.8;
    col+=vec3(.8,.9,1.)*exp(-length(p-vec2(-.03,.03))*60.)*2.2;
  } else { // 馬頭星雲
    vec2 p=uv+vec2(.05,.12); float bgn=fbm(p*3.+t)*.65+.2, streak=fbm(p*vec2(9.,2.)+t);
    float up=smoothstep(-.08,.12,p.y+.02*sin(p.x*9.)+(fbm(p*5.)-.5)*.12);
    vec3 bg=mix(uC1,uC2,bgn)*(.4+1.5*up*(1.-smoothstep(.1,.75,p.y)*.4))*(.7+.6*streak);
    float e=(fbm(p*8.)-.5)*.045; float neck=sdCap(p,vec2(.02,-.12),vec2(.05,.22),.1), head=length(rot(.55)*(p-vec2(.15,.31))*vec2(1.,1.65))-.14;
    float sd=min(neck,head)+e; float horse=1.-smoothstep(-.015,.02,sd); float bottom=1.-smoothstep(-.12,-.02,p.y-(.0+e*2.));
    float dust=max(horse,bottom); float edge=clamp(smoothstep(.0,.03,sd+.03)-smoothstep(.03,.07,sd+.03),0.,1.)*(1.-bottom);
    col=bg*(1.-dust*.95)+uC3*edge*.7*up+uC1*.12*bottom*fbm(p*10.); shade=1.-dust*.9;
    col+=uC3*.35*smoothstep(.55,.0,length(p-vec2(-.55,.1)))*fbm(p*4.); // 火焰星雲暗示
  }
  col+=stars(uv)*shade;
  col=1.-exp(-col*1.1); col=pow(col,vec3(1.05));
  float vg=1.-smoothstep(.55,1.25,length((gl_FragCoord.xy-.5*uRes)/uRes.y)); col*=.55+.45*vg;
  gl_FragColor=vec4(col,1.);
}
</script>

function render(now){var n=NEB[S.i],t=S.time;
  gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uTime,t);gl.uniform2f(U.uPan,S.px,S.py);gl.uniform1f(U.uZoom,S.zoom);gl.uniform1f(U.uType,S.i);gl.uniform1f(U.uSeed,n.seed);
  gl.uniform3fv(U.uC1,n.c[0]);gl.uniform3fv(U.uC2,n.c[1]);gl.uniform3fv(U.uC3,n.c[2]);gl.uniform3fv(U.uC4,n.c[3]);gl.drawArrays(gl.TRIANGLES,0,3);}
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;if(COSMOS.anim)S.time+=dt;
  S.zoom+=(S.tz-S.zoom)*Math.min(1,dt*6);S.px+=(S.tpx-S.px)*Math.min(1,dt*8);S.py+=(S.tpy-S.py)*Math.min(1,dt*8);
  if(S.auto){var tt=now/1000;S.tpx=Math.sin(tt*.07)*.05;S.tpy=Math.cos(tt*.05)*.035;S.tz=1.12+Math.sin(tt*.045)*.1;}
  render(now);if(S.music)UMUSIC.update(19+S.zoom*.3,.15,.6);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
