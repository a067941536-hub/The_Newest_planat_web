<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="宇宙尺度之旅：從地球近景一路縮小到太陽系、銀河系、本星系群與星系團，也能放大看清每一顆行星。">
<title>宇宙尺度之旅 — 星宇・探索</title>
<link rel="icon" type="image/png" href="images/planeticon.png">
<link rel="stylesheet" href="SEstyle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cosmos/cosmos.css">
<meta name="theme-color" content="#060818">
<style>
html,body{overflow:hidden}
.wrapper{min-height:0!important;height:100vh;height:100svh}
.stage{position:relative;height:calc(100svh - 72px);overflow:hidden}
#uv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.u-panel{position:absolute!important;border-radius:20px!important;padding:16px 18px;z-index:20;overflow:visible!important}
.layer-card{left:16px;top:16px;width:300px}
.layer-card.flash{animation:cardIn .7s var(--ease)}
@keyframes cardIn{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.layer-card small{color:var(--teal);letter-spacing:.3em;font-size:.68rem}
.layer-card h1{margin:2px 0 8px;font-family:var(--font-display);font-size:1.45rem;letter-spacing:.05em;border:0!important;padding:0!important}
.layer-card p{margin:0;color:#d3dbff;font-size:.9rem;line-height:1.8}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.read div{padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.read small{display:block;color:var(--dim);letter-spacing:.1em;font-size:.66rem}
.read b{font-weight:500;font-size:.92rem;color:#fff}
.ctrls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cbtn{font:inherit;font-size:.82rem;color:var(--muted);background:rgba(139,124,246,.1);border:1px solid var(--line);border-radius:99px;padding:7px 15px;cursor:pointer;transition:.25s var(--ease)}
.cbtn:hover{color:#fff;border-color:var(--line-strong)}
.cbtn.on{color:#fff;background:linear-gradient(135deg,rgba(139,124,246,.55),rgba(94,234,212,.3));border-color:var(--line-strong);box-shadow:0 0 18px rgba(139,124,246,.35)}
/* 右側縮放尺 */
.zbar{position:absolute;right:14px;top:84px;bottom:104px;width:92px;z-index:20}
.z-track{position:absolute;right:20px;top:0;bottom:0;width:22px;cursor:pointer;touch-action:none}
.z-track::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;border-radius:2px;background:linear-gradient(#8b7cf6,#5eead4 40%,#ffd98a 80%,#f0abfc);opacity:.7}
.z-thumb{position:absolute;left:3px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(139,124,246,.5),0 0 18px #8b7cf6;transition:top .05s}
.z-ticks{position:absolute;right:46px;top:0;bottom:0;width:100px}
.tick{position:absolute;right:0;transform:translateY(-50%);display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--dim);font:inherit;font-size:.74rem;cursor:pointer;padding:2px 0;transition:.25s}
.tick:hover{color:#fff}.tick i{width:8px;height:1px;background:currentColor}
.bar-bottom{position:absolute;width:max-content;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;display:flex;gap:6px;padding:8px;max-width:calc(100% - 32px);overflow-x:auto;border-radius:999px!important;scrollbar-width:none}
.bar-bottom::-webkit-scrollbar{display:none}
.chip-b{flex:none;font:inherit;font-size:.82rem;color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;transition:.25s var(--ease)}
.chip-b:hover{color:#fff;background:rgba(139,124,246,.2);border-color:var(--line-strong)}
.zoom-btns{position:absolute;right:16px;bottom:76px;z-index:20;display:none}
#tip{position:absolute;z-index:30;pointer-events:none;padding:6px 12px;border-radius:10px;background:rgba(8,12,36,.88);border:1px solid var(--line-strong);font-size:.8rem;opacity:0;transition:opacity .15s;transform:translate(12px,-34px);white-space:nowrap}
.hintline{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:15;color:var(--dim);font-size:.76rem;letter-spacing:.14em;pointer-events:none;white-space:nowrap;animation:hintFade 14s forwards}
@keyframes hintFade{0%,80%{opacity:1}100%{opacity:0}}

/* ---- 電影感：開場、字幕、黑邊 ---- */
.stage.tour .layer-card,.stage.tour .zbar,.stage.tour .bar-bottom,.stage.tour .hintline{opacity:0!important;visibility:hidden;pointer-events:none;transition:opacity .8s,visibility 0s .8s}
.sound-fab,.anim-fab{display:none!important}
.layer-card,.zbar,.bar-bottom{transition:opacity .8s}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:26;transition:height 1.4s var(--ease);pointer-events:none}
.lb.t{top:0}.lb.b{bottom:0}.stage.tour .lb{height:7vh}
#expo{position:absolute;top:calc(7vh + 18px);left:50%;transform:translateX(-50%);z-index:27;font-family:var(--font-display);letter-spacing:.3em;color:rgba(190,205,255,.85);font-size:.9rem;opacity:0;transition:opacity 1s;pointer-events:none}
#expo sup{font-size:.7em}.stage.tour #expo{opacity:1}
.cine{position:absolute;left:0;right:0;bottom:calc(7vh + 54px);z-index:27;text-align:center;pointer-events:none;padding:0 20px;opacity:0;transform:translateY(16px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.cine.show{opacity:1;transform:none}
.cine h2{margin:0 0 8px;font-family:var(--font-display);font-size:clamp(1.8rem,5.2vw,3.6rem);letter-spacing:.32em;font-weight:700;border:0!important;padding:0!important;text-shadow:0 0 40px rgba(139,124,246,.9),0 4px 30px rgba(0,0,0,.9);background:linear-gradient(120deg,#fff,#c9d4ff 50%,#9ff3e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.cine p{margin:0;color:#dfe6ff;font-size:clamp(.95rem,1.8vw,1.25rem);letter-spacing:.08em;text-shadow:0 2px 18px rgba(0,0,0,.95)}
.tour-bar{position:absolute;right:18px;bottom:calc(7vh + 14px);z-index:28;display:flex;gap:8px;align-items:center;opacity:0;pointer-events:none;transition:opacity .8s}
.tour-bar.show{opacity:1;pointer-events:auto}
.tour-bar .step{color:var(--dim);font-size:.78rem;letter-spacing:.2em;margin-right:6px}
.intro{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 55%,rgba(6,8,24,.25),rgba(3,4,14,.86) 75%);backdrop-filter:blur(3px);transition:opacity 1s,visibility 1s}
.intro.hide{opacity:0;pointer-events:none}.intro.gone{display:none}
.intro .in{max-width:640px;animation:introIn 1.6s var(--ease) both}
@keyframes introIn{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.intro small{color:var(--teal);letter-spacing:.5em;font-size:.72rem}
.intro h1{margin:14px 0 12px;font-family:var(--font-display);font-size:clamp(2.2rem,7vw,4.4rem);letter-spacing:.12em;border:0!important;padding:0!important;background:linear-gradient(120deg,#fff 10%,#b9c6ff 45%,#7cf0dc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.intro p{color:#cfd8ff;line-height:1.9;margin:0 0 26px;font-size:1.02rem}
.intro .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.intro .big{padding:15px 36px;font-size:1.02rem}
.intro .hint{margin-top:18px;color:var(--dim);font-size:.8rem;letter-spacing:.14em}
.end-card{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(4,5,18,.35),rgba(3,4,14,.8));padding:24px}
.end-card.show{display:flex;animation:introIn 1.4s var(--ease) both}
.end-card h2{font-family:var(--font-display);font-size:clamp(1.6rem,4.4vw,3rem);letter-spacing:.14em;margin:0 0 10px;border:0!important;padding:0!important}
.end-card p{color:#cfd8ff;margin:0 0 22px;line-height:1.9}
@media(max-width:860px){
  .layer-card{right:100px;width:auto;padding:12px 14px}.layer-card p{font-size:.8rem;line-height:1.6}.layer-card h1{font-size:1.15rem}
  .read{margin-top:8px}.ctrls{margin-top:8px}.zbar{width:70px;top:70px}.z-ticks{right:34px;width:60px}.tick{font-size:.66rem}
  .hintline{display:none}.bar-bottom{left:12px;transform:none;max-width:calc(100% - 24px);padding-left:56px}
}
@media(max-width:560px){.layer-card p{display:none}.read b{font-size:.8rem}}
</style>
</head>
<body>
<div class="wrapper">
<header class="top-nav">
  <a href="index.html" class="logo-link"></a>
  <nav class="menu">
    <a href="index.html" class="menu-item">主頁</a>
    <a href="SEplanets.html" class="menu-item active">星球</a>
    <a href="SEother.html" class="menu-item">星座</a>
    <a href="SEfortune.html" class="menu-item">神社</a>
    <a href="SEabout.html" class="menu-item">關於</a>
  </nav>
</header>
<div class="stage" id="stage">
  <canvas id="uv" aria-label="宇宙尺度縮放"></canvas>
  <div class="hintline">拖曳平移 · 滾輪縮放 · 點選天體飛過去</div>
  <div id="tip"></div>
  <aside class="u-panel glass layer-card" id="layerCard">
    <small>SCALE · 宇宙尺度</small>
    <h1 id="lTitle">太陽系</h1>
    <p id="lText"></p>
    <div class="read"><div><small>畫面寬度約</small><b id="rW">—</b></div><div><small>光穿過畫面需要</small><b id="rT">—</b></div></div>
    <div class="ctrls"><button class="cbtn" id="btnOut">▶ 自動縮小</button><button class="cbtn" id="btnIn">◀ 自動放大</button><button class="cbtn" id="btnTour">🎬 導覽模式</button><button class="cbtn" id="btnMusic">🔇 配樂</button><button class="cbtn" id="btnAnim">✨ 動畫：開</button><button class="cbtn" id="btnCenter">⌖ 置中</button></div>
  </aside>
  <div class="zbar">
    <div class="z-ticks" id="zTicks"></div>
    <div class="z-track" id="zTrack"><div class="z-thumb" id="zThumb"></div></div>
  </div>
  <nav class="bar-bottom glass" id="chips" aria-label="快速前往"></nav>
  <div class="lb t"></div><div class="lb b"></div>
  <div id="expo"></div>
  <div class="cine" id="cine"><h2 id="cineT"></h2><p id="cineS"></p></div>
  <div class="tour-bar" id="tourBar"><span class="step" id="tourStep"></span><button class="cbtn" id="tPause">⏸ 暫停</button><button class="cbtn" id="tSkip">⏭ 下一站</button><button class="cbtn" id="tMute">🔊</button><button class="cbtn" id="tExit">✕ 結束</button></div>
  <div class="end-card" id="endCard"><div><span class="eyebrow">THE END · 回家吧</span><h2 style="margin-top:14px"><span class="grad-text">你剛走過 20 個數量級</span></h2><p>從 1 萬公里的地球，到 930 億光年的宇宙。<br>而你，此刻就坐在其中那顆藍色小點上。</p><div class="cta-row" style="justify-content:center"><button class="btn primary" id="eAgain">↺ 再看一次</button><button class="btn" id="eFree">自由探索</button></div></div></div>
  <div class="intro" id="intro"><div class="in"><small>POWERS OF TEN · 宇宙尺度</small><h1>宇宙尺度之旅</h1><p>從 1 萬公里寬的地球，一路躍進到 930 億光年的可觀測宇宙。<br>每一步，都放大十倍、百倍、億倍。</p><div class="row"><button class="btn primary big" id="goTour">▶ 開始導覽（含配樂）</button><button class="btn big" id="goFree">自由探索</button></div><div class="hint">🎧 建議戴上耳機　·　全程約 1 分 40 秒</div></div></div>
  <div class="zoom-btns"><button id="zIn"></button><button id="zOut"></button></div>
</div>
</div>
<script src="cosmos/cosmos.js"></script>
<script src="cosmos/astro.js"></script>
<script src="cosmos/universe-tex.js"></script>
<script src="cosmos/universe-music.js"></script>
<script src="cosmos/universe.js"></script>
</body>
</html>
